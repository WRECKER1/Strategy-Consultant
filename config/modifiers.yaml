# =============================================================================
# CONTEXT MODIFIERS — Layer 2 (MT §4.2, Table 5)
# Modifiers shift thresholds or reinterpret scores. They never add or remove
# constructs (MT §4.2). Every applied effect is printed in the Show Evidence panel.
# Thresholds referred to here are defined in rules.yaml → thresholds.
# =============================================================================

version: "1.0.0"
source: "Midterm report, Section 4.2, Table 5"
combination: additive                      # D-07: threshold deltas are summed

context_fields:                            # Form A (MT §2 stage 1), validated by the intake agent
  industry:              {type: string, required: true}
  employees:             {type: integer, required: false, note: "used to derive size"}
  size:                  {type: enum, values: [small, medium, large], required: true, derive_from: employees}
  ownership:             {type: enum, values: [listed_private, state_owned, family, mnc_subsidiary], required: true}
  regulatory_intensity:  {type: enum, values: [high, medium, low], required: true}
  environmental_uncertainty: {type: enum, values: [low, low_moderate, high_moderate, high], required: true}
  life_cycle_stage:      {type: enum, values: [entrepreneurial, collectivity, formalization, elaboration], required: true}
  geography:             {type: string, required: true}
  transformation_announcement_date: {type: date, required: true}
  transformation_stage:  {type: enum, values: [announced, scaling, mature], required: true, derive_from: transformation_announcement_date}
  as_of_date:            {type: date, required: true, note: "analysis date; anchors recency rules (D-16)"}
  synthetic:             {type: boolean, required: true, note: "true for T1–T5; printed on every output"}

derivations:
  size:                                    # MT Table 5: Small <1,000; Large >10,000
    - {value: small,  rule: "employees < 1000"}
    - {value: large,  rule: "employees > 10000"}
    - {value: medium, rule: "otherwise"}
  transformation_stage:                    # MT Table 5: <1 yr / 1–3 yrs / >3 yrs
    - {value: announced, rule: "months_since_announcement < 12"}
    - {value: scaling,   rule: "months_since_announcement <= 36"}
    - {value: mature,    rule: "otherwise"}

modifiers:

  regulatory_intensity:
    basis: "MT Table 5 row 1; T4 paper trace (MT Table 9)"
    effects:
      high:
        - type: threshold_shift
          threshold: so_low                # D-06: construct-level, as in T4 (2.5 → 2.0)
          delta: -0.5
          applies_to_rules: [M1, M5]
          band_flag:                       # SO between adjusted and unadjusted threshold, with DA ≥ 4
            id: REG_CONSTRAINT
            label: "Regulated-design constraint"
            text: "Some centralization of risk control is legitimate in a highly regulated firm; reported as a constraint, not a misfit."
            show_unadjusted_result: true
      medium: []
      low: []
    confirm_at_cp2_if: "value == 'medium'"   # borderline call (MT Table 11)
    examples_high: ["banks", "insurers", "pharma", "utilities"]

  environmental_uncertainty:
    basis: "MT Table 5 row 2 (Duncan): +0.5 required SO per step above low-moderate"
    verify: "Verify Duncan's framework against Daft & Uppal, ch. [environment chapter]"
    effects:
      low:           []
      low_moderate:  []
      high_moderate: [{type: threshold_shift, threshold: so_low, delta: 0.5, applies_to_rules: [M1, M5]}]
      high:          [{type: threshold_shift, threshold: so_low, delta: 1.0, applies_to_rules: [M1, M5]}]
    confirm_at_cp2_if: "always"            # sector uncertainty rating is an analyst judgement

  size:
    basis: "MT Table 5 row 3; D-12 (no reweighting, to keep equal weights, MT §3.1)"
    effects:
      small:
        - type: exclude_from_mean
          indicator: EC1
          when: "EC1 is Insufficient or EC1 == 1"
          note: "Contextual ambidexterity accepted for small firms; no separate unit is not penalized."
      medium: []
      large:
        - type: option_order
          rule: M4
          order: [F, G]
          note: "Structural separation (EC1) is the expected route to ambidexterity in large firms."
    confirm_at_cp2_if: "employees is missing"

  life_cycle_stage:
    basis: "MT Table 5 row 4; D-13"
    effects:
      entrepreneurial: []
      collectivity: []
      formalization:
        - type: annotate
          indicator: SO3
          when: "SO3 <= 2"
          text: "High formalization is expected at the formalization stage; treated as a misfit signal only if DA is high (M1 already requires DA ≥ 4)."
      elaboration: []
    confirm_at_cp2_if: "always"            # MT Table 11 names this exact judgement call
    verify: "Verify life-cycle stages against Daft & Uppal, ch. [life-cycle chapter]"

  ownership:
    basis: "MT Table 5 row 5; D-14"
    effects:
      listed_private: []
      family: []
      state_owned:
        - type: require_parent_evidence
          indicator: SO2
          required_row_field: {level: parent}
          pending_label: "Pending: parent/ministry evidence required"
          else: Insufficient
      mnc_subsidiary:
        - type: require_parent_evidence
          indicator: SO2
          required_row_field: {level: parent}
          pending_label: "Pending: parent-company evidence required"
          else: Insufficient
    analyst_override: {checkpoint: CP2, logged: true}

  transformation_stage:
    basis: "MT Table 5 row 6; D-15"
    effects:
      announced:
        - type: too_early
          indicator: CA2
          when: "CA2 <= 2"
          label: "Too early to judge"
          exclude_from_mean: true
          rule_substitution: {rule: M3, replace: "mean(CA2, CA3)", with: "CA3"}
      scaling: []
      mature: []
    confirm_at_cp2_if: "months_since_announcement between 10 and 14 or between 34 and 38"   # near a boundary
