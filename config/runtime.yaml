# =============================================================================
# RUNTIME SETTINGS — NOT part of the theory and NOT in the core fingerprint.
# Changing the model, mode or chunk size here does not change the core logic
# (D-22). Every run copies this file into its run folder, so results stay
# reproducible.
# =============================================================================

version: "1.0.0"

# How LLM agents are executed:
#   api    – call the Claude API (needs ANTHROPIC_API_KEY or `ant auth login`)
#   paste  – write each prompt to a file; you run it in Claude Pro and save the
#            JSON reply next to it, then resume (free, slow)
#   replay – use cached responses only; never calls the API (demo safety net)
agent_mode: paste            # no API credit available (26 Nov): agents run in claude.ai via paste mode

model: claude-opus-5-5
max_tokens: 16000
fallbacks: default            # server-side refusal fallback (beta server-side-fallback-2026-07-01); set to off to disable
effort:                       # output_config.effort per agent
  extraction: medium
  classification: low
  recommendation: medium
  report: medium

chunk_words: 3500             # source text is split on page boundaries into chunks of about this size
extraction_batch_words:       # words of source text per extraction prompt
  api: 3500
  paste: 12000                # fewer, larger prompts for claude.ai (D-29)
classification_batch_rows:
  api: 40
  paste: 150
cache_dir: cache              # cached agent responses: cache/<case_id>/<agent>/<hash>.json
max_cost_usd_per_run: 10.0    # the run stops before any call that would take it over this amount

# USD per million tokens (Claude API list prices; check the Anthropic pricing page before relying on them)
prices:
  claude-opus-5-5:   {input: 4.0, output: 20.0, cache_read: 0.20, cache_write: 5.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.10, cache_write: 2.5}
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
